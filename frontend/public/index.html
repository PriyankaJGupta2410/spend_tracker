<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d6fc4">
  <title>Spend Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#1d6fc4"/>
        <path d="M8 21l5-5 4 4 7-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="brand-name">Spend Tracker</h1>
    </div>
  </header>

  <main>
    <section id="auth-section" class="card auth-card" aria-labelledby="auth-heading">
      <h2 id="auth-heading">Log in or create an account</h2>
      <p class="lede">Track what you spend and see how it changes each month.</p>
      <form id="auth-form" class="stack" novalidate>
        <label>Username
          <input id="username" type="text" autocomplete="username" minlength="3" maxlength="30" required>
        </label>
        <label>Password
          <input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required>
        </label>
        <div class="buttons">
          <button type="submit" id="login-btn" class="btn btn-primary">Log in</button>
          <button type="button" id="register-btn" class="btn btn-secondary">Create account</button>
        </div>
      </form>
      <p id="auth-message" role="status"></p>
    </section>

    <div id="app" class="dashboard" hidden>
      <div class="user-bar">
        <p>Signed in as <strong id="whoami"></strong></p>
        <button type="button" id="logout" class="btn btn-secondary btn-small">Log out</button>
      </div>

      <section class="card add-card" aria-labelledby="add-heading">
        <div class="card-head"><h2 id="add-heading">Add an expense</h2></div>
        <form id="expense-form" class="form-grid" novalidate>
          <label>Amount
            <input id="amount" name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0.00" required>
          </label>
          <label>Date
            <input id="date" name="date" type="date" required>
          </label>
          <label class="full">Category
            <input id="category" name="category" type="text" maxlength="50" required placeholder="food, travel, rent">
          </label>
          <label class="full">Note (optional)
            <input id="note" name="note" type="text" maxlength="200" placeholder="What was it for?">
          </label>
          <button type="submit" id="add-btn" class="btn btn-primary full">Add expense</button>
        </form>
        <p id="form-message" role="status"></p>
      </section>

      <section class="card summary-card" aria-labelledby="summary-heading">
        <div class="card-head">
          <h2 id="summary-heading">Summary</h2>
          <label class="inline">Month <input id="month" type="month"></label>
        </div>
        <p id="summary-message" role="status"></p>
        <div id="summary-body">
          <div class="total-block">
            <p class="total-label">Total spent</p>
            <p class="total"><span id="total">0.00</span></p>
            <p id="mom" class="mom mom-none"></p>
          </div>
          <div id="insights"></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Category</th><th class="num">Total</th><th class="num">Share</th></tr></thead>
              <tbody id="by-category"></tbody>
            </table>
          </div>
          <p class="footnote">All-time total: <strong id="all-time">0.00</strong></p>
        </div>
      </section>

      <section class="card list-card" aria-labelledby="list-heading">
        <div class="card-head">
          <h2 id="list-heading">Expenses this month</h2>
          <label class="inline">Category <input id="filter-category" type="text" placeholder="All categories"></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="num">Amount</th></tr></thead>
            <tbody id="expenses"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
