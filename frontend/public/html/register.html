<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d6fc4">
  <title>Create account | Spend Tracker</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/register.css">
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card" aria-labelledby="register-heading">
      <div class="auth-brand"><img src="/favicon.svg" alt=""><span>Spend Tracker</span></div>
      <h1 id="register-heading" class="page-title">Create your account</h1>
      <p class="lede">It takes a few seconds. Your expenses stay private to you.</p>

      <form id="register-form" class="stack" novalidate>
        <label>Username
          <input id="username" type="text" autocomplete="username" maxlength="30" autofocus required>
          <span class="field-hint">3 to 30 letters, numbers or underscores.</span>
        </label>
        <label>Password
          <input id="password" type="password" autocomplete="new-password" maxlength="72" required>
          <span class="field-hint">At least 8 characters.</span>
        </label>
        <label>Confirm password
          <input id="confirm" type="password" autocomplete="new-password" maxlength="72" required>
        </label>
        <button type="submit" id="register-btn" class="btn btn-primary">Create account</button>
      </form>
      <p id="register-message" role="status"></p>

      <p class="auth-switch">Already have an account? <a class="link" href="/login">Log in</a></p>
    </section>
  </main>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
